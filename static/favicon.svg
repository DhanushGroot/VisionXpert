<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Enhanced definitions with more gradients -->
  <defs>
    <!-- Base cube gradient -->
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="50%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0a2351" />
    </linearGradient>
    
    <!-- Top face gradient -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    
    <!-- Side face gradient -->
    <linearGradient id="sideGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2351" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    
    <!-- Eye iris gradient -->
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#29b6f6" />
      <stop offset="70%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#01579b" />
    </radialGradient>
    
    <!-- Highlight effect -->
    <radialGradient id="highlightGradient" cx="35%" cy="35%" r="60%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    
    <!-- X symbol gradient -->
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    
    <!-- Glass effect filter -->
    <filter id="glassEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur" />
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <fePointLight x="100" y="100" z="200" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="litPaint" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 3D Cube - more pronounced perspective -->
  <!-- Base/front face -->
  <path d="M15,25 L70,15 L85,30 L30,40 Z" fill="url(#cubeGradient)" filter="url(#glassEffect)" />
  <!-- Top face -->
  <path d="M30,40 L85,30 L95,75 L40,85 Z" fill="url(#topGradient)" filter="url(#glassEffect)" />
  <!-- Side face -->
  <path d="M15,25 L30,40 L40,85 L25,70 Z" fill="url(#sideGradient)" filter="url(#glassEffect)" />
  
  <!-- Eye element with enhanced details -->
  <g transform="translate(46, 50) scale(0.85) rotate(-10)">
    <!-- Outer eye shape with shadow -->
    <ellipse cx="0" cy="0" rx="30" ry="22" fill="#01579b" filter="url(#glassEffect)" />
    <!-- Main eye shape -->
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="#2196f3" filter="url(#glassEffect)" />
    
    <!-- Iris -->
    <ellipse cx="0" cy="0" rx="16" ry="16" fill="url(#irisGradient)" />
    
    <!-- Detailed iris lines -->
    <g stroke="#01579b" stroke-opacity="0.3" fill="none">
      <circle cx="0" cy="0" r="14" />
      <circle cx="0" cy="0" r="12" />
      <circle cx="0" cy="0" r="10" />
      <path d="M-16,0 L16,0" />
      <path d="M0,-16 L0,16" />
      <path d="M-11,-11 L11,11" />
      <path d="M11,-11 L-11,11" />
    </g>
    
    <!-- Pupil with depth -->
    <circle cx="0" cy="0" r="7" fill="#000000" />
    <circle cx="0" cy="0" r="6" fill="#000000" />
    <circle cx="-1" cy="-1" r="1" fill="#263238" />
    
    <!-- Light reflections -->
    <ellipse cx="-5" cy="-5" rx="4" ry="3" fill="#ffffff" fill-opacity="0.9" />
    <ellipse cx="5" cy="5" rx="2" ry="1.5" fill="#ffffff" fill-opacity="0.7" />
    
    <!-- Overall eye highlight -->
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="url(#highlightGradient)" />
  </g>
  
  <!-- Enhanced X symbol -->
  <g transform="translate(80, 24) rotate(15) scale(0.6)">
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="url(#xGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glassEffect)" />
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
  
  <!-- Edge highlights on cube -->
  <path d="M15,25 L70,15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" fill="none" />
  <path d="M70,15 L85,30" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" fill="none" />
  <path d="M85,30 L95,75" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" fill="none" />
  
  <!-- Additional decorative elements -->
  <circle cx="20" cy="30" r="3" fill="#29b6f6" filter="url(#glassEffect)" />
  <circle cx="75" cy="80" r="4" fill="#29b6f6" filter="url(#glassEffect)" />
  <path d="M20,30 L75,80" stroke="#29b6f6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" fill="none" />
</svg>
